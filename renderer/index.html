<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LS's DW</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body data-mode="split">
<div id="app">
  <!-- Top toolbar -->
  <header id="toolbar">
    <div class="brand">LS's DW</div>
    <button id="btn-new" title="New Page (Ctrl+N)">New</button>
    <button id="btn-open" title="Open Page (Ctrl+O)">Open</button>
    <button id="btn-open-site" title="Open Site Folder">Open Site</button>
    <button id="btn-save" title="Save (Ctrl+S)">Save</button>
    <button id="btn-saveas" title="Save As (Ctrl+Shift+S)">Save As</button>
    <button id="btn-preview" title="Preview in Browser">Browser Preview</button>
    <span class="sep"></span>
    <div class="seg">
      <button id="btn-mode-code" data-mode="code">Code</button>
      <button id="btn-mode-split" data-mode="split" class="on">Split</button>
      <button id="btn-mode-design" data-mode="design">Design</button>
    </div>
    <button id="btn-refresh" title="Refresh design view / apply code changes (F5)">&#8635;</button>
    <span class="sep"></span>
    <button id="btn-undo" title="Undo (Ctrl+Z)">&#8630;</button>
    <button id="btn-redo" title="Redo (Ctrl+Y)">&#8631;</button>
    <span class="sp"></span>
    <span id="doc-name">Untitled-1</span>
    <span id="dirty-dot" class="hidden" title="Unsaved changes">&#9679;</span>
  </header>

  <!-- Three-column main area -->
  <div id="main">
    <!-- Left column: Insert / Files / CSS -->
    <aside id="left">
      <div class="tabs">
        <button id="tab-btn-insert" data-tab="insert" class="on">Insert</button>
        <button id="tab-btn-files" data-tab="files">Files</button>
        <button id="tab-btn-css" data-tab="css">CSS</button>
      </div>
      <div id="tab-insert" class="tabpane"></div>
      <div id="tab-files" class="tabpane hidden">
        <div class="row-2">
          <button id="btn-new-page" class="grow">+ New Page</button>
        </div>
        <div id="file-tree"></div>
      </div>
      <div id="tab-css" class="tabpane hidden">
        <div class="css-head">
          <span id="css-target-label">Internal stylesheet</span>
          <button id="btn-css-back" class="hidden" title="Back to internal stylesheet">&#8617;</button>
        </div>
        <div class="row-2">
          <button id="btn-css-new-rule">+ New Rule</button>
          <button id="btn-css-link">Link External CSS</button>
        </div>
        <div class="row-2">
          <button id="btn-css-new-file">+ New CSS File</button>
          <button id="btn-css-save" disabled>Save External CSS</button>
        </div>
        <textarea id="css-editor" spellcheck="false" placeholder="/* Internal stylesheet (<style> content) */"></textarea>
      </div>
    </aside>

    <!-- Center: design view + code view -->
    <div id="center">
      <div id="stage">
        <div id="design-pane"><iframe id="design-frame" title="Design view"></iframe></div>
        <div id="code-pane">
          <div class="code-head">
            <span>Code</span>
            <span id="code-hint" class="hint"></span>
            <span class="sp"></span>
            <button id="btn-apply-code" class="hidden">Apply Code</button>
          </div>
          <div id="code-scroll">
            <div class="code-row">
              <div id="code-gutter">1</div>
              <div class="code-inner">
                <pre id="code-pre"></pre>
                <textarea id="code-ta" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Right column: properties panel -->
    <aside id="right">
      <div class="props-title">Properties</div>
      <div id="props"></div>
    </aside>
  </div>

  <!-- Status bar -->
  <footer id="statusbar">
    <span id="crumb">Nothing selected</span>
    <span class="sp"></span>
    <span id="st-dims"></span>
    <span id="st-mode"></span>
    <span id="st-enc">UTF-8</span>
  </footer>
</div>

<datalist id="class-list"></datalist>
<div id="ctxmenu" class="hidden"></div>
<div id="dlg-root"></div>
<div id="toast"></div>

<script src="js/dialogs.js"></script>
<script src="js/state.js"></script>
<script src="js/undo.js"></script>
<script src="js/editor-core.js"></script>
<script src="js/dom-ops.js"></script>
<script src="js/serialize.js"></script>
<script src="js/code-view.js"></script>
<script src="js/properties.js"></script>
<script src="js/insert-panel.js"></script>
<script src="js/site-manager.js"></script>
<script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>LS的DW</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body data-mode="split">
<div id="app">
  <!-- 顶部工具栏 -->
  <header id="toolbar">
    <div class="brand">LS的DW</div>
    <button id="btn-new" title="新建页面 (Ctrl+N)">新建</button>
    <button id="btn-open" title="打开网页 (Ctrl+O)">打开</button>
    <button id="btn-open-site" title="打开站点文件夹">打开站点</button>
    <button id="btn-save" title="保存 (Ctrl+S)">保存</button>
    <button id="btn-saveas" title="另存为 (Ctrl+Shift+S)">另存为</button>
    <button id="btn-preview" title="在浏览器中预览">浏览器预览</button>
    <span class="sep"></span>
    <div class="seg">
      <button id="btn-mode-code" data-mode="code">代码</button>
      <button id="btn-mode-split" data-mode="split" class="on">拆分</button>
      <button id="btn-mode-design" data-mode="design">设计</button>
    </div>
    <button id="btn-refresh" title="刷新设计视图 / 应用代码修改 (F5)">↻</button>
    <span class="sep"></span>
    <button id="btn-undo" title="撤销 (Ctrl+Z)">↶</button>
    <button id="btn-redo" title="重做 (Ctrl+Y)">↷</button>
    <span class="sp"></span>
    <span id="doc-name">未命名-1</span>
    <span id="dirty-dot" class="hidden" title="有未保存的修改">●</span>
  </header>

  <!-- 三栏主体 -->
  <div id="main">
    <!-- 左栏：插入 / 文件 / CSS -->
    <aside id="left">
      <div class="tabs">
        <button id="tab-btn-insert" data-tab="insert" class="on">插入</button>
        <button id="tab-btn-files" data-tab="files">文件</button>
        <button id="tab-btn-css" data-tab="css">CSS</button>
      </div>
      <div id="tab-insert" class="tabpane"></div>
      <div id="tab-files" class="tabpane hidden">
        <div class="row-2">
          <button id="btn-new-page" class="grow">＋ 新建页面</button>
        </div>
        <div id="file-tree"></div>
      </div>
      <div id="tab-css" class="tabpane hidden">
        <div class="css-head">
          <span id="css-target-label">内部样式表</span>
          <button id="btn-css-back" class="hidden" title="返回内部样式表">↩</button>
        </div>
        <div class="row-2">
          <button id="btn-css-new-rule">＋ 新建规则</button>
          <button id="btn-css-link">链接外部CSS</button>
        </div>
        <div class="row-2">
          <button id="btn-css-new-file">＋ 新建CSS文件</button>
          <button id="btn-css-save" disabled>保存外部CSS</button>
        </div>
        <textarea id="css-editor" spellcheck="false" placeholder="/* 内部样式表（<style> 内容） */"></textarea>
      </div>
    </aside>

    <!-- 中间：设计视图 + 代码视图 -->
    <div id="center">
      <div id="stage">
        <div id="design-pane"><iframe id="design-frame" title="设计视图"></iframe></div>
        <div id="code-pane">
          <div class="code-head">
            <span>源代码</span>
            <span id="code-hint" class="hint"></span>
            <span class="sp"></span>
            <button id="btn-apply-code" class="hidden">应用代码</button>
          </div>
          <div id="code-scroll">
            <div class="code-row">
              <div id="code-gutter">1</div>
              <div class="code-inner">
                <pre id="code-pre"></pre>
                <textarea id="code-ta" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 右栏：属性面板 -->
    <aside id="right">
      <div class="props-title">属性面板</div>
      <div id="props"></div>
    </aside>
  </div>

  <!-- 状态栏 -->
  <footer id="statusbar">
    <span id="crumb">未选中</span>
    <span class="sp"></span>
    <span id="st-dims"></span>
    <span id="st-mode"></span>
    <span id="st-enc">UTF-8</span>
  </footer>
</div>

<datalist id="class-list"></datalist>
<div id="ctxmenu" class="hidden"></div>
<div id="dlg-root"></div>
<div id="toast"></div>

<script src="js/dialogs.js"></script>
<script src="js/state.js"></script>
<script src="js/undo.js"></script>
<script src="js/editor-core.js"></script>
<script src="js/dom-ops.js"></script>
<script src="js/serialize.js"></script>
<script src="js/code-view.js"></script>
<script src="js/properties.js"></script>
<script src="js/insert-panel.js"></script>
<script src="js/site-manager.js"></script>
<script src="js/app.js"></script>
</body>
</html>
